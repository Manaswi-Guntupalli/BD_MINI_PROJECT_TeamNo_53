name: Unit checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m compileall -q search_engine jobs scripts
      - run: PYTHONPATH=. python -m pytest -q tests/
      - run: PYTHONPATH=. python scripts/check_input.py fixtures/pages.jsonl --phase 0
